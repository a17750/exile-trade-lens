name: Translation data check

# Temporarily disabled while the local data pipeline is being stabilized.
# Restore the workflow_dispatch/schedule triggers after local regression passes.
on: []

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build dataset from English and official TW sources
        run: node scripts/build-data.mjs

      - name: Run quality gate
        run: node scripts/check-quality.mjs

      - name: Run pipeline tests
        run: |
          node scripts/pipeline-test.mjs
          node scripts/smoke-test.mjs
          node scripts/item-name-domain-test.mjs
          node scripts/hover-original-smoke-test.mjs
          node scripts/item-field-rendering-test.mjs
          node scripts/background-smoke-test.mjs
          node scripts/bridge-context-smoke-test.mjs
          node scripts/missing-report-policy-test.mjs

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-audit-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish updated translation dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trade-api.json extension/data/bundled.json extension/data/bundled-manifest.json extension/data/remote-manifest.json
          if git diff --cached --quiet; then
            echo "Translation dataset is unchanged."
          else
            git commit -m "chore(data): update translation dataset"
            git push
          fi
